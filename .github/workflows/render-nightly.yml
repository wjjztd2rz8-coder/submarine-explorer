# S-render: scheduled diagnostics for Claude's golden review, outside release gates.
name: Nightly golden and performance diagnostics

on:
  schedule:
    - cron: '23 8 * * *'
  workflow_dispatch:

permissions:
  contents: read

# Serialize scheduled and manual runs, including dispatches on different refs.
concurrency:
  group: render-nightly
  cancel-in-progress: false

jobs:
  diagnostics:
    # Keep browser/font baselines stable across ubuntu-latest OS migrations.
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    outputs:
      review_build: ${{ steps.review_build.outcome }}
    defaults:
      run:
        shell: bash
    env:
      CI: true
      # golden.sh supplies a root URL; perf-budget does not resolve a project base.
      VITE_BASE: /
      DIAGNOSTICS_DIR: .cache/render-nightly/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
      PERF_TIERS: low,medium,high
      # src/game/Cosmetics.ts HERO_SITES, rather than the seven-site review table.
      PERF_SITES: titanic,lost-city,great-blue-hole,beebe-vent-field,monterey-canyon
    steps:
      - name: Checkout exact run SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: npm

      - name: Record provenance
        run: |
          mkdir -p "$DIAGNOSTICS_DIR"
          {
            git rev-parse HEAD
            sha256sum package-lock.json
            node --version
            npm --version
            printf 'run=%s attempt=%s base=%s\ntiers=%s\nsites=%s\n' \
              "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$VITE_BASE" "$PERF_TIERS" "$PERF_SITES"
          } > "$DIAGNOSTICS_DIR/run.txt"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Install dependencies
        timeout-minutes: 5
        run: npm ci 2>&1 | tee "$DIAGNOSTICS_DIR/npm-install.log"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ubuntu-24.04-${{ runner.arch }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium
        id: chromium
        timeout-minutes: 8
        run: bash tools/install-playwright-chromium.sh 2>&1 | tee "$DIAGNOSTICS_DIR/chromium-install.log"

      - name: Capture existing golden set
        id: golden
        # Hosted SwiftShader can load a valid scene yet stall screenshot readback.
        # Preserve the failure in the summary and artifacts; this is review evidence.
        continue-on-error: true
        timeout-minutes: 30
        run: |
          # Ask the OS for a free loopback port; strictPort rejects any allocation race.
          GOLDEN_PORT=$(python3 -c 'import socket; s = socket.socket(); s.bind(("127.0.0.1", 0)); print(s.getsockname()[1]); s.close()')
          export GOLDEN_PORT
          bash tools/golden.sh 2>&1 | tee "$DIAGNOSTICS_DIR/golden.log"

      - name: Bind review build to this SHA and deployment base
        if: ${{ !cancelled() && steps.chromium.outcome == 'success' && steps.golden.outcome != 'skipped' }}
        run: node tools/ci-build-manifest.mjs write / dist

      - name: Share the golden build with capability review shards
        id: review_build
        if: ${{ !cancelled() && steps.chromium.outcome == 'success' && steps.golden.outcome != 'skipped' && success() }}
        timeout-minutes: 5
        uses: actions/upload-artifact@v4
        with:
          name: render-build-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

      - name: Check event layouts and exploration behavior
        if: ${{ !cancelled() && steps.chromium.outcome == 'success' && steps.golden.outcome != 'skipped' }}
        timeout-minutes: 35
        env:
          PW_RENDER_REVIEW: '1'
          PLAYWRIGHT_JSON_OUTPUT_FILE: ${{ env.DIAGNOSTICS_DIR }}/e2e/report.json
        run: |
          # Golden built this exact SHA; Playwright owns its preview server.
          test -f dist/index.html
          PW_PORT=$(python3 -c 'import socket; s = socket.socket(); s.bind(("127.0.0.1", 0)); print(s.getsockname()[1]); s.close()')
          export PW_PORT
          npx playwright test \
            tests/e2e/f-events-reform.spec.ts tests/e2e/f-verify-1000.spec.ts \
            tests/e2e/f-bluehole-squiggle.spec.ts tests/e2e/f2-explore.spec.ts \
            --grep 'visible spawn|golden sediment|approach, first scan|first minute, one Journal|f2-explore' \
            --grep-invert '@render' --global-timeout=1800000 \
            --retries=0 --reporter=list,json --output="$DIAGNOSTICS_DIR/e2e" \
            2>&1 | tee "$DIAGNOSTICS_DIR/e2e.log"

      - name: Report continuous render guards
        id: render
        if: ${{ !cancelled() && steps.chromium.outcome == 'success' && steps.golden.outcome != 'skipped' }}
        # Full-resolution High and long frame sequences exceed hosted CPU budgets.
        # Keep assertions intact; a graceful runner deadline writes the JSON report.
        continue-on-error: true
        timeout-minutes: 35
        env:
          PW_RENDER_REVIEW: '1'
          PLAYWRIGHT_JSON_OUTPUT_FILE: ${{ env.DIAGNOSTICS_DIR }}/render/report.json
        run: |
          test -f dist/index.html
          PW_PORT=$(python3 -c 'import socket; s = socket.socket(); s.bind(("127.0.0.1", 0)); print(s.getsockname()[1]); s.close()')
          export PW_PORT
          npx playwright test tests/e2e/f-bluehole-squiggle.spec.ts tests/e2e/f-verify-1000.spec.ts \
            --grep '@render' --global-timeout=1800000 --retries=0 \
            --reporter=list,json --output="$DIAGNOSTICS_DIR/render" \
            2>&1 | tee "$DIAGNOSTICS_DIR/render.log"

      - name: Benchmark every supported tier at the five hero sites
        id: perf
        continue-on-error: true
        # Capture failure must not hide numeric diagnostics; cancellation stops new work.
        if: ${{ !cancelled() && steps.chromium.outcome == 'success' && steps.golden.outcome != 'skipped' }}
        timeout-minutes: 30
        run: |
          # golden.sh has stopped its preview. Reuse its build with a new owned server.
          test -f dist/index.html
          port=$(python3 -c 'import socket; s = socket.socket(); s.bind(("127.0.0.1", 0)); print(s.getsockname()[1]); s.close()')
          base_url="http://127.0.0.1:$port/"
          preview_pid=''
          cleanup() {
            if [[ -n "$preview_pid" ]]; then
              # A dedicated process group also covers any preview child processes.
              kill -TERM -- "-$preview_pid" 2>/dev/null || true
              wait "$preview_pid" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          setsid node node_modules/vite/bin/vite.js preview \
            --host 127.0.0.1 --port "$port" --strictPort \
            > "$DIAGNOSTICS_DIR/perf-preview.log" 2>&1 &
          preview_pid=$!
          ready=false
          for attempt in {1..60}; do
            if ! kill -0 "$preview_pid" 2>/dev/null; then
              cat "$DIAGNOSTICS_DIR/perf-preview.log"
              exit 1
            fi
            if curl --fail --silent --show-error --max-time 2 "$base_url" \
              -o /dev/null 2>> "$DIAGNOSTICS_DIR/perf-readiness.log"; then
              ready=true
              break
            fi
            sleep 1
          done
          if [[ "$ready" != true ]]; then
            echo "Preview did not become ready at $base_url" >&2
            exit 1
          fi
          printf 'preview=%s pid=%s\n' "$base_url" "$preview_pid" \
            >> "$DIAGNOSTICS_DIR/run.txt"
          # Leave time for the shell trap and uploads before the Actions deadline.
          timeout --kill-after=15s 25m node tools/perf-budget.mjs "$base_url" "$DIAGNOSTICS_DIR/perf" \
            2>&1 | tee "$DIAGNOSTICS_DIR/perf.log"

      - name: Summarize render diagnostics
        if: always()
        env:
          GOLDEN_OUTCOME: ${{ steps.golden.outcome }}
          RENDER_OUTCOME: ${{ steps.render.outcome }}
          PERF_OUTCOME: ${{ steps.perf.outcome }}
        run: |
          {
            echo '### Render diagnostics (review evidence)'
            echo '| Capture | Outcome |'
            echo '| --- | --- |'
            echo "| Golden | $GOLDEN_OUTCOME |"
            echo "| Continuous guards | $RENDER_OUTCOME |"
            echo "| Software GL benchmark | $PERF_OUTCOME |"
            echo ''
            echo 'Failure or skipped means incomplete/unaccepted evidence, even when this workflow is green. Inspect manifests, JSON reports and logs. Hosted SwiftShader timings do not establish device performance.'
          } >> "$GITHUB_STEP_SUMMARY"
          for outcome in "$GOLDEN_OUTCOME" "$RENDER_OUTCOME" "$PERF_OUTCOME"; do
            if [[ "$outcome" != success ]]; then
              echo '::warning::Render diagnostics need review; see the summary and retained artifacts.'
              break
            fi
          done

      - name: Upload golden outputs
        if: always()
        timeout-minutes: 3
        uses: actions/upload-artifact@v4
        with:
          name: golden-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: .cache/golden/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload numeric results and benchmark captures
        if: always()
        timeout-minutes: 3
        uses: actions/upload-artifact@v4
        with:
          name: perf-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: ${{ env.DIAGNOSTICS_DIR }}/perf/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload available logs and provenance
        if: always()
        timeout-minutes: 3
        uses: actions/upload-artifact@v4
        with:
          name: render-logs-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: |
            ${{ env.DIAGNOSTICS_DIR }}/*.log
            ${{ env.DIAGNOSTICS_DIR }}/run.txt
            .cache/golden-build.log
            .cache/golden-preview.log
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload render guard captures and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: render-guards-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: |
            ${{ env.DIAGNOSTICS_DIR }}/e2e/
            ${{ env.DIAGNOSTICS_DIR }}/render/
            .cache/bluehole-squiggle/
            .cache/codex/shots/f-geo-scarp/
            .cache/codex/shots/f1-terrain/
            .cache/codex/shots/f-visual-qa/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14

  capability-review:
    # Review images from the folded HUD/opening/Journal families stay available
    # nightly, using golden.sh's exact build even if image readback failed.
    needs: diagnostics
    if: ${{ !cancelled() && needs.diagnostics.outputs.review_build == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      CI: true
      VITE_BASE: /
      PW_RENDER_REVIEW: '1'
      PW_OUTDIR: dist
      PW_PORT: '4473'
      PLAYWRIGHT_JSON_OUTPUT_FILE: .cache/capability-review/report.json
    steps:
      - name: Checkout exact run SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: npm
      - name: Install dependencies
        timeout-minutes: 5
        run: npm ci
      - name: Download this run's golden build
        uses: actions/download-artifact@v4
        with:
          name: render-build-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: dist/
      - name: Verify SHA, base and dependencies
        run: node tools/ci-build-manifest.mjs verify / dist
      - name: Install Playwright Chromium
        timeout-minutes: 8
        run: bash tools/install-playwright-chromium.sh
      - name: Capture capability evidence and run its assertions
        run: >-
          npx playwright test tests/e2e/hud-touch.spec.ts
          tests/e2e/opening-framing.spec.ts tests/e2e/journal-debrief.spec.ts
          tests/e2e/terrain-render.spec.ts tests/e2e/d-sonar.spec.ts
          --fully-parallel --workers=1 --shard=${{ matrix.shard }}/4
          --retries=0 --reporter=list,json
          --output=.cache/capability-review/tests
      - name: Upload captures, numeric evidence and failure reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capability-review-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: |
            .cache/capability-review/
            .cache/codex/shots/
            tests/e2e/screenshots/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
