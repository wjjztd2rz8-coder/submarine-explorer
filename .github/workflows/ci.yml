# Continuous integration: Python pipeline tests, typecheck + build, unit tests,
# Playwright e2e (Chromium on SwiftShader), attribution and formatting checks.
# See docs/deploy.md. Every step can be reproduced locally with `npm run ci`.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to the same branch or PR cancels the run it supersedes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: build and test
    runs-on: ubuntu-latest
    # Runners have no GPU, so Chromium renders WebGL on SwiftShader (a few fps).
    # The e2e suite is single-worker by design (playwright.config.ts); give it room.
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        # Keep one browser worker per runner; extra shards leave room for the
        # CI-only timeouts and retry without competing for software-renderer CPU.
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    env:
      CI: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Python pipeline tests (stdlib unittest)
        run: python3 -m unittest discover -s tools/tests

      - name: Validate every mission pack
        run: npm run check:content

      - name: Typecheck and build
        run: npm run build

      - name: Unit tests (vitest)
        run: npm test

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium
        # Always ensure OS dependencies, even when the browser cache was restored.
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests (Playwright)
        # Tiles are committed under data/tiles/, so the e2e suite needs no network.
        # Derive the denominator from the matrix to keep shard coverage complete.
        run: npm run test:e2e -- --reporter=list,html --shard=${{ matrix.shard }}/${{ strategy.job-total }}

      - name: Attribution check
        run: python3 tools/check_attribution.py

      - name: Project-base build and browser check
        if: matrix.shard == 1
        run: npm run test:e2e:base

      - name: Prettier
        run: npx prettier --check .

      - name: Upload e2e screenshots and report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}
          path: |
            tests/e2e/screenshots
            .cache/codex/shots
            playwright-report
            test-results
            test-results-project-base
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 14
