# Push/PR CI: static checks, unit tests, production builds, and project-base browser check.
# The 38-shard Playwright matrix runs on demand via the "E2E full matrix" workflow.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to a PR cancels the run it supersedes. Running main jobs finish;
# a newer push can replace the group's single pending run before its jobs start.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  checks:
    # Preserve the existing status name for branch protection.
    name: build and static checks
    needs: check-shards
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require every static-check shard
        env:
          RESULT: ${{ needs.check-shards.result }}
        run: test "$RESULT" = success

  check-shards:
    name: static checks (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: ['1/3', '2/3', '3/3']
    env:
      CI: true
      # Only unit tests shard; every runner retains the canonical static gates.
      VITEST_SHARD: ${{ matrix.shard }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: npm

      - name: Install dependencies
        timeout-minutes: 5
        run: npm ci

      - name: Static gates
        run: bash tools/gates.sh --phase checks

  builds:
    name: build (${{ matrix.label }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: root
            base: /
            outdir: dist-root
          - label: project-base
            base: /submarine-explorer/
            outdir: dist-project-base
    env:
      CI: true
      VITE_BASE: ${{ matrix.base }}
      PW_OUTDIR: ${{ matrix.outdir }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: npm

      - name: Install dependencies
        timeout-minutes: 5
        run: npm ci

      - name: Build deployment base and manifest
        timeout-minutes: 5
        run: bash tools/gates.sh --phase build

      - name: Upload immutable build
        uses: actions/upload-artifact@v4
        with:
          name: ci-build-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.label }}
          path: ${{ matrix.outdir }}/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

  project-base:
    # Preserve the existing status name; builds now owns artifact production.
    name: project-base build and browser check
    needs: builds
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: true
      VITE_BASE: /submarine-explorer/
      PW_BASE: /submarine-explorer/
      PW_PORT: 4211
      PW_OUTDIR: dist-project-base
      PW_BASE_RESULTS: test-results-project-base
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: npm

      - name: Install dependencies
        timeout-minutes: 5
        run: npm ci

      - name: Download project-base build
        uses: actions/download-artifact@v4
        with:
          name: ci-build-${{ github.run_id }}-${{ github.run_attempt }}-project-base
          path: dist-project-base

      - name: Install Playwright Chromium
        timeout-minutes: 8
        uses: ./.github/actions/install-chromium

      - name: Project-base browser check
        timeout-minutes: 10
        run: >-
          bash tools/gates.sh --phase e2e-base --prebuilt --
          --reporter=list,html --workers=1 --global-timeout=480000 --max-failures=1

      - name: Upload project-base screenshots and report
        if: failure()
        timeout-minutes: 2
        uses: actions/upload-artifact@v4
        with:
          name: project-base-artifacts-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report
            test-results-project-base
          if-no-files-found: ignore
          retention-days: 14
