<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Life preview (dev only)</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #03080b;
        color: #cde0e5;
        font:
          12px/1.4 'Space Mono',
          monospace;
        overflow: hidden;
      }
      canvas {
        display: block;
      }
      #labels div {
        position: fixed;
        transform: translate(-50%, 0);
        padding: 1px 5px;
        font-size: 11px;
        white-space: nowrap;
        color: #cde0e5;
        background: rgba(6, 14, 18, 0.55);
        border: 1px solid rgba(205, 224, 229, 0.18);
        pointer-events: none;
      }
      #panel {
        position: fixed;
        top: 8px;
        left: 8px;
        padding: 8px 10px;
        background: rgba(6, 14, 18, 0.7);
        border: 1px solid rgba(205, 224, 229, 0.2);
      }
      #panel.hidden {
        display: none;
      }
      #stats {
        margin-top: 6px;
        white-space: pre;
        color: #2ed9d9;
      }
    </style>
  </head>
  <body>
    <div id="labels"></div>
    <div id="panel">
      <div>drag: orbit · wheel: zoom · right-drag: pan · H: hide</div>
      <div id="stats"></div>
    </div>
    <script type="module" src="./life.ts"></script>
  </body>
</html>
