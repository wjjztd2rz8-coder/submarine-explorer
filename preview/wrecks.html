<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Wreck preview (dev only)</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #03080b;
        color: #cde0e5;
        font: 12px/1.4 'Space Mono', monospace;
        overflow: hidden;
      }
      canvas {
        display: block;
      }
      #panel {
        position: fixed;
        top: 8px;
        left: 8px;
        padding: 8px 10px;
        background: rgba(6, 14, 18, 0.7);
        border: 1px solid rgba(205, 224, 229, 0.2);
      }
      #panel label {
        display: block;
        margin: 2px 0;
      }
      #stats {
        margin-top: 6px;
        white-space: pre;
        color: #2ed9d9;
      }
      #panel.hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="panel">
      <label>wreck <select id="wreck"></select></label>
      <label>tier <select id="tier"></select></label>
      <label>lod <select id="lod"><option>auto</option><option>near</option><option>mid</option><option>far</option></select></label>
      <label>fog <input id="fog" type="range" min="0" max="0.03" step="0.001" value="0.008" /></label>
      <label>spot az <input id="spotAz" type="range" min="0" max="360" value="220" /></label>
      <label>spot el <input id="spotEl" type="range" min="5" max="85" value="35" /></label>
      <div>drag: orbit · right-drag: pan · wheel: zoom · H: hide panel</div>
      <div id="stats"></div>
    </div>
    <script type="module" src="./wrecks.ts"></script>
  </body>
</html>
