<!doctype html>
<html lang="en">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vehicle preview · Bathyline</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #02070b;
        overflow: hidden;
        font:
          13px/1.4 'Space Mono',
          ui-monospace,
          Menlo,

      canvas {
        display: block;

        padding: 6px 10px;
        pointer-events: none;
        white-space: pre;
      }

    <canvas id="c"></canvas>
    <div id="info"></div>
    <script type="module" src="./vehicles.ts"></script>
